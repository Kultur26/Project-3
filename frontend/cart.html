<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — StudentMarket</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/merch.css">
</head>
<body class="merch-page">

<header class="app-header">
    <a href="merch.html" class="icon-btn">←</a>
    <h1 class="app-title">Your Cart</h1>
    <span class="icon-btn"></span>
</header>

<main class="section">
    <div id="cartItems"></div>

    <div id="cartSummary" class="card" style="display:none;">
        <div style="display:flex; justify-content:space-between; padding:12px 0;">
            <strong>Total</strong>
            <strong id="cartTotal">R0.00</strong>
        </div>
        <button class="add-to-cart" id="checkoutBtn" style="justify-content:center;">
            Checkout
        </button>
        <button class="pill" id="clearCartBtn" style="margin-top:8px; width:100%;">
            Clear Cart
        </button>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
